name: on demand deploy from feature branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch to deploy"
        required: true
        type: string

concurrency:
  group: on-demand-feature-deploy
  cancel-in-progress: true

env:
  INCLUDE_SLOW_TESTS: "true"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nodlify-api

jobs:
  prepare-env:
    name: Prepare environment
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
      application_version: ${{ steps.version.outputs.application_version }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Prepare deploy version
        id: version
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE_TAG="feature-${SHORT_SHA}"
          APPLICATION_VERSION="0.0.0-${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "application_version=${APPLICATION_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Deploying branch: ${{ inputs.branch }}"
          echo "Image tag: ${IMAGE_TAG}"
          echo "Application version: ${APPLICATION_VERSION}"

  build-code:
    name: Build code
    runs-on: self-hosted
    needs: [ prepare-env ]
    permissions:
      contents: read

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "liberica"
          cache: "gradle"

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          validate-wrappers: false

      - name: Build
        run: |
          ./gradlew clean build jacocoTestReport \
            -PapplicationVersion="${{ needs.prepare-env.outputs.application_version }}" \
            --info --stacktrace

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: nodlify
          SONAR_PROJECT_KEY: nodlify_nodlify-api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          if-no-files-found: error

  build-image:
    name: Build Docker image
    runs-on: self-hosted
    needs: [ build-code, prepare-env ]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ needs.prepare-env.outputs.image_tag }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push feature image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ inputs.branch }}
    runs-on: self-hosted
    needs: [ build-image, prepare-env ]
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ needs.prepare-env.outputs.image_tag }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup deploy config
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K3S_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply secrets
        run: |
          kubectl -n nodlify-test create secret generic nodlify-api-secret \
            --from-literal=database-user="${{ secrets.TEST_NODLIFY_DATABASE_USER }}" \
            --from-literal=database-password="${{ secrets.TEST_NODLIFY_DATABASE_PASS }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Generate token for infra repo
        id: infra-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: nodlify
          repositories: nodlify-infra

      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          repository: nodlify/nodlify-infra
          path: infra
          token: ${{ steps.infra-token.outputs.token }}
          persist-credentials: false

      - name: Apply manifests
        run: |
          kubectl apply -k infra/k8s/overlays/test

      - name: Deploy to k3s
        run: |
          kubectl -n nodlify-test set image deployment/nodlify-api nodlify-api="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          kubectl -n nodlify-test rollout status deployment/nodlify-api --timeout=180s
