plugins {
    id 'groovy'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.ben-manes.versions' version '0.54.0'
    id 'org.hibernate.orm' version '7.4.2.Final'
    id 'tailwind-conventions'
    id 'jacoco'
//	id 'org.graalvm.buildtools.native' version '0.10.6'
}

group = 'com.nodlify'
version = '0.2.0'

tailwind {
    version = '3.4.17'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        resources {
            srcDir(layout.buildDirectory.dir('generated/tailwind'))
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url = 'https://repo.spring.io/milestone' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    // oauth2
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'

    // swagger support
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3"

    // hypersistence
    implementation "io.hypersistence:hypersistence-utils-hibernate-73:3.15.3"

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'

    // modulith
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'

    // flyway
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // testcontainers
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-spock'

    // okHttp
    implementation(platform("com.squareup.okhttp3:okhttp-bom:5.4.0"))
    implementation "com.squareup.okhttp3:okhttp"
    implementation "com.squareup.okhttp3:logging-interceptor"

    // okHttp mock server
    testImplementation "com.squareup.okhttp3:mockwebserver"

    // groovy
    testImplementation "org.apache.groovy:groovy-all:5.0.7"

    // apache commons
    implementation "org.apache.commons:commons-lang3:3.20.0"

    // spock
    testImplementation "org.spockframework:spock-core:2.4-groovy-5.0"
    testImplementation "org.spockframework:spock-spring:2.4-groovy-5.0"

    // junit launcher
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

hibernate {
    enhancement {
        enableDirtyTracking = true
        enableAssociationManagement = true
        enableLazyInitialization = false
        enableExtendedEnhancement = false
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:2.1.0"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

version = providers
        .gradleProperty('applicationVersion')
        .orElse('dev-build')
        .get()

def applicationVersion = version.toString()

processResources {
    dependsOn 'buildTailwind'
    exclude 'tailwind/**'

    filesMatching('application.yml') {
        filter { line ->
            line.replace('@application.version@', applicationVersion)
        }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
