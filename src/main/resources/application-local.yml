# for local development with HyperSQL
NODLIFY_DATABASE_FILE: ./data/nodlify

spring:
  jpa:
    # ddl-auto is left to the active datasource profile (validate on Postgres, none on HyperSQL).
    generate-ddl: false
    show-sql: true
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true

# override observability config
nodlify:
  observability:
    problem:
      enabled: true
      logged-statuses: [ 400, 401, 403, 409, 500, 503 ]
    audit:
      enabled: true

gg:
  jte:
    development-mode: true
    templateLocation: src/main/jte
    templateSuffix: .jte
