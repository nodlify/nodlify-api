spring:
  application:
    name: nodlify

  docker:
    compose:
      lifecycle-management: start_and_stop

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nodlify
        jdbc:
          time_zone: UTC
        show_sql: false

  datasource:
    url: jdbc:postgresql://${NODLIFYDATABASE_URL:localhost:5432/nodlify}?currentSchema=nodlify
    username: ${NODLIFYDATABASE_USER:root}
    password: ${NODLIFYDATABASE_PASS:pass}
    name: nodlify
    hikari:
      maximum-pool-size: 20

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    schemas: nodlify
    default-schema: nodlify
    create-schemas: true

  modulith:
    events:
      jdbc:
        schema: nodlify

  web:
    error:
      include-binding-errors: never
      include-message: never
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false

logback:
  log:
    dir: /app/logs

springdoc:
  show-actuator: false
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  info:
    git:
      mode: full
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: info,health,metrics,loggers

server:
  forward-headers-strategy: framework

nodlify:
  version: '@application.version@'
  keys:
    remember-me-key: ${NODLIFY_REMEMBER_ME_KEY:none}
  geocoding:
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:nodlify (rafal.kawczynski@outlook.com)}
    search-limit: 5
    rate-limit-enabled: ${GEOCODING_RATE_LIMIT_ENABLED:true}
    rate-limit-max-requests: ${GEOCODING_RATE_LIMIT_MAX_REQUESTS:60}
    rate-limit-window: ${GEOCODING_RATE_LIMIT_WINDOW:1m}
