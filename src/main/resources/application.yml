spring:
  application:
    name: nodlify

  messages:
    fallback-to-system-locale: false
    encoding: UTF-8

  docker:
    compose:
      lifecycle-management: start_and_stop

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  web:
    error:
      include-binding-errors: never
      include-message: never
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false

logback:
  log:
    dir: /app/logs

springdoc:
  show-actuator: false
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  info:
    git:
      mode: full
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: info,health,metrics,loggers

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SID

nodlify:
  default:
    frontend: false
  version: '@application.version@'
  keys:
    remember-me-key: ${NODLIFY_REMEMBER_ME_KEY:none}
  geocoding:
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:nodlify (rafal.kawczynski@outlook.com)}
    search-limit: 5
    rate-limit-enabled: ${GEOCODING_RATE_LIMIT_ENABLED:true}
    rate-limit-max-requests: ${GEOCODING_RATE_LIMIT_MAX_REQUESTS:60}
    rate-limit-window: ${GEOCODING_RATE_LIMIT_WINDOW:1m}

gg:
  jte:
    # to be replaced with src/resources/templates
    template-location: src/resources/jte
