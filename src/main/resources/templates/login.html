<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(
          title=~{::title},
          header=~{::header},
          content=~{::main},
          footer=${null},
          scripts=~{::script}
      )}"
>
<head>
    <title>Sign in · Nodlify</title>
</head>
<body>
<div th:fragment="main"
     class="auth-page"
     x-data="{ showPw: false, email: '', pw: '' }">

    <div class="auth-form-side">
        <div class="auth-top">
            <a href="/"><span class="logo">nodlify<span class="dot">.</span></span></a>
            <span class="small">No account? <a href="/register">Create one</a></span>
        </div>

        <div class="auth-form-wrap">
            <div class="auth-head">
                <span class="eyebrow">Sign in</span>
                <h1>Welcome back.</h1>
                <p>Sign in to manage your polls and see who's voted.</p>
            </div>

            <th:block th:if="${param.error}">
                <div class="field-error mb-4">Invalid email or password.</div>
            </th:block>
            <th:block th:if="${param.logout}">
                <div class="mb-4 text-[13px] text-[var(--yes)]">You have been signed out.</div>
            </th:block>

            <form class="auth-form"
                  th:action="@{/login}"
                  method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email"
                           placeholder="you@company.com"
                           x-model="email"
                           autocomplete="email"
                           autofocus/>
                </div>

                <div class="field">
                    <label for="password">
                        Password
                        <a href="/reset-password">Forgot?</a>
                    </label>
                    <div class="password-wrap">
                        <input id="password" :type="showPw ? 'text' : 'password'" name="password"
                               placeholder="••••••••"
                               x-model="pw"
                               autocomplete="current-password"/>
                        <button type="button" class="toggle-pw" @click="showPw = !showPw"
                                x-text="showPw ? 'Hide' : 'Show'"></button>
                    </div>
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" name="remember-me" checked/> Keep me signed in for 30 days
                </label>

                <button type="submit" class="btn auth-submit">
                    Sign in <span class="arrow">→</span>
                </button>

                <div class="auth-divider">or continue with</div>
                <div class="grid grid-cols-2 gap-2.5">
                    <a href="/oauth2/authorization/google" class="oauth-btn">
                        <img th:src="@{/icons/google.svg}" width="16" height="16" alt="" aria-hidden="true">
                        Google
                    </a>
                    <a href="/oauth2/authorization/github" class="oauth-btn">
                        <img th:src="@{/icons/github.svg}" width="16" height="16" alt="" aria-hidden="true">
                        GitHub
                    </a>
                </div>
            </form>

            <p class="auth-foot">
                Trouble signing in? <a href="#">Contact support</a>
            </p>
        </div>

        <div class="auth-bottom">
            <span>© 2026 Nodlify</span>
            <span class="links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Status</a>
      </span>
        </div>
    </div>
</div>

</body>
</html>
