<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(
          title=~{::title},
          header=~{::header},
          content=~{::main},
          footer=${null},
          scripts=~{::script}
      )}"
>
<head>
    <title th:text="|#{login.eyebrow} · Nodlify|">Sign in · Nodlify</title>
</head>
<body>
<div th:fragment="main"
     class="auth-page"
     x-data="{ showPw: false, email: '', pw: '' }">

    <div class="auth-form-side">
        <div class="auth-top">
            <a href="/"><span class="logo">nodlify<span class="dot">.</span></span></a>
            <span class="small"><span th:text="#{login.noAccount}">No account?</span> <a href="/register" th:text="#{login.createOne}">Create one</a></span>
        </div>

        <div class="auth-form-wrap">
            <div class="auth-head">
                <span class="eyebrow" th:text="#{login.eyebrow}">Sign in</span>
                <h1 th:text="#{login.heading}">Welcome back.</h1>
                <p th:text="#{login.subtitle}">Sign in to manage your polls and see who's voted.</p>
            </div>

            <th:block th:if="${param.error}">
                <div class="field-error mb-4" th:text="#{login.error}">Invalid email or password.</div>
            </th:block>
            <th:block th:if="${param.logout}">
                <div class="mb-4 text-[13px] text-[var(--yes)]" th:text="#{login.loggedOut}">You have been signed out.</div>
            </th:block>

            <form class="auth-form"
                  th:action="@{/login}"
                  method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="field">
                    <label for="email" th:text="#{login.email}">Email</label>
                    <input id="email" type="email" name="email"
                           placeholder="you@company.com"
                           x-model="email"
                           autocomplete="email"
                           autofocus/>
                </div>

                <div class="field">
                    <label for="password">
                        <span th:text="#{login.password}">Password</span>
                        <a href="/reset-password" th:text="#{login.forgot}">Forgot?</a>
                    </label>
                    <div class="password-wrap">
                        <input id="password" :type="showPw ? 'text' : 'password'" name="password"
                               placeholder="••••••••"
                               x-model="pw"
                               autocomplete="current-password"/>
                        <button type="button" class="toggle-pw" @click="showPw = !showPw"
                                x-text="showPw ? $store.i18n.t('common.hide') : $store.i18n.t('common.show')"></button>
                    </div>
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" name="remember-me" checked/> <span th:text="#{login.remember}">Keep me signed in for 30 days</span>
                </label>

                <button type="submit" class="btn auth-submit">
                    <span th:text="#{login.submit}">Sign in</span> <span class="arrow">→</span>
                </button>

                <div class="auth-divider" th:text="#{common.continueWith}">or continue with</div>
                <div class="grid grid-cols-2 gap-2.5">
                    <a href="/oauth2/authorization/google" class="oauth-btn">
                        <img th:src="@{/icons/google.svg}" width="16" height="16" alt="" aria-hidden="true">
                        Google
                    </a>
                    <a href="/oauth2/authorization/github" class="oauth-btn">
                        <img th:src="@{/icons/github.svg}" width="16" height="16" alt="" aria-hidden="true">
                        GitHub
                    </a>
                </div>
            </form>

            <p class="auth-foot">
                <span th:text="#{login.trouble}">Trouble signing in?</span> <a href="#" th:text="#{login.contactSupport}">Contact support</a>
            </p>
        </div>

        <div class="auth-bottom">
            <span th:text="#{footer.copyrightShort}">© 2026 Nodlify</span>
            <span class="links">
        <a href="#" th:text="#{common.privacy}">Privacy</a>
        <a href="#" th:text="#{common.terms}">Terms</a>
        <a href="#" th:text="#{common.status}">Status</a>
      </span>
        </div>
    </div>
</div>

</body>
</html>
