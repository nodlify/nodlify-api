<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(
          title=~{::title},
          header=~{::header},
          content=~{::main},
          footer=${null},
          scripts=~{::script}
      )}"
>
<head>
    <title>Create account · Nodlify</title>
</head>
<body>
<div th:fragment="main"
     class="auth-page"
     x-data="{
       showPw: false,
       name: '',
       email: '',
       pw: '',
       agree: false,
       get strength() {
         if (this.pw.length === 0) return 0;
         if (this.pw.length < 6)  return 1;
         if (this.pw.length < 10) return 2;
         return 3;
       },
       get strengthLabel() { return ['','weak','okay','strong'][this.strength]; },
       get canSubmit() { return this.agree && this.name.trim().length >= 2 && this.pw.length >= 8 && this.email.length > 0; }
     }">

    <div class="auth-form-side">
        <div class="auth-top">
            <a href="/"><span class="logo">nodlify<span class="dot">.</span></span></a>
            <span class="small">Already have an account? <a href="/login">Sign in</a></span>
        </div>

        <div class="auth-form-wrap">
            <div class="auth-head">
                <span class="eyebrow">Create account</span>
                <h1>Start in 30 seconds.</h1>
                <p>Free forever for groups up to 30. No credit card needed.</p>
            </div>

            <form class="auth-form"
                  th:action="@{/register}"
                  method="post"
                  @submit.prevent="canSubmit && $el.submit()">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="field">
                    <label for="name">Your name</label>
                    <input id="name" type="text" name="displayName"
                           placeholder="Sofia Reyes"
                           x-model="name"
                           autocomplete="name"
                           minlength="2"
                           maxlength="50"
                           required
                           autofocus/>
                </div>

                <div class="field">
                    <label for="email">Work email</label>
                    <input id="email" type="email" name="email"
                           placeholder="you@company.com"
                           x-model="email"
                           autocomplete="email"/>
                    <span class="hint">We'll send a verification link.</span>
                </div>

                <div class="field">
                    <label for="password">
                        Password
                        <span x-show="pw.length > 0"
                              class="font-mono text-[11px] uppercase tracking-[0.04em]"
                              :class="{ 'text-[var(--no)]': strength === 1, 'text-[var(--maybe)]': strength === 2, 'text-[var(--yes)]': strength === 3 }"
                              x-text="strengthLabel"></span>
                    </label>
                    <div class="password-wrap">
                        <input id="password" :type="showPw ? 'text' : 'password'" name="password"
                               placeholder="At least 8 characters"
                               x-model="pw"
                               autocomplete="new-password"/>
                        <button type="button" class="toggle-pw" @click="showPw = !showPw"
                                x-text="showPw ? 'Hide' : 'Show'"></button>
                    </div>
                    <div class="mt-1 flex gap-[3px]">
                        <template x-for="i in [1,2,3]" :key="i">
              <span class="h-[3px] flex-1 rounded-sm transition-colors"
                    :class="strength >= i ? { 1: 'bg-[var(--no)]', 2: 'bg-[var(--maybe)]', 3: 'bg-[var(--yes)]' }[strength] : 'bg-[var(--line-2)]'"></span>
                        </template>
                    </div>
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" x-model="agree" name="agree"/>
                    <span>I agree to the
            <a href="#" class="border-b-[0.5px] border-[var(--line)] text-[var(--ink)]">terms</a>
            and
            <a href="#" class="border-b-[0.5px] border-[var(--line)] text-[var(--ink)]">privacy policy</a>
          </span>
                </label>

                <button type="submit" class="btn auth-submit"
                        :disabled="!canSubmit"
                        :class="{ 'cursor-not-allowed opacity-40': !canSubmit }">
                    Create account <span class="arrow">→</span>
                </button>

                <div class="auth-divider">or continue with</div>
                <div class="grid grid-cols-2 gap-2.5">
                    <a href="/oauth2/authorization/google" class="oauth-btn">
                        <img th:src="@{/icons/google.svg}" width="16" height="16" alt="" aria-hidden="true">
                        Google
                    </a>

                    <a href="/oauth2/authorization/github" class="oauth-btn">
                        <img th:src="@{/icons/github.svg}" width="16" height="16" alt="" aria-hidden="true">
                        GitHub
                    </a>
                </div>
            </form>

            <p class="auth-foot">By creating an account you accept our terms.</p>
        </div>

        <div class="auth-bottom">
            <span>© 2026 Nodlify</span>
            <span class="links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Status</a>
      </span>
        </div>
    </div>
</div>

</body>
</html>
