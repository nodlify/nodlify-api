<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(
          title=~{::title},
          header=${null},
          content=~{::main},
          footer=${null},
          scripts=~{::script}
      )}"
>
<head>
    <title th:text="|#{reset.eyebrow} · Nodlify|">Reset password · Nodlify</title>
</head>
<body>
<div th:fragment="main"
     class="auth-page">

    <div class="auth-form-side">
        <div class="auth-top">
            <a href="/"><span class="logo">nodlify<span class="dot">.</span></span></a>
        </div>

        <div class="auth-form-wrap">
            <div class="auth-head">
                <span class="eyebrow" th:text="#{reset.eyebrow}">Reset password</span>
                <h1 th:text="#{reset.heading}">Forgot your password?</h1>
                <p th:text="#{reset.subtitle}">This feature is coming soon. Contact your administrator for help.</p>
            </div>

            <a href="/login" class="btn auth-submit inline-flex items-center gap-1.5 no-underline"
               th:text="#{reset.backToSignIn}">
                ← Back to sign in
            </a>
        </div>

        <div class="auth-bottom">
            <span th:text="#{footer.copyrightShort}">© 2026 Nodlify</span>
            <span class="links">
        <a href="#" th:text="#{common.privacy}">Privacy</a>
        <a href="#" th:text="#{common.terms}">Terms</a>
        <a href="#" th:text="#{common.status}">Status</a>
      </span>
        </div>
    </div>
</div>

</body>
</html>
