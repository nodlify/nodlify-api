<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(
          title=~{::title},
          header=${null},
          content=~{::main},
          footer=${null},
          scripts=~{::script}
      )}"
>
<head>
    <title>Reset password · Nodlify</title>
</head>
<body>
<div th:fragment="main"
     class="auth-page">

    <div class="auth-form-side">
        <div class="auth-top">
            <a href="/"><span class="logo">nodlify<span class="dot">.</span></span></a>
        </div>

        <div class="auth-form-wrap">
            <div class="auth-head">
                <span class="eyebrow">Reset password</span>
                <h1>Forgot your password?</h1>
                <p>This feature is coming soon. Contact your administrator for help.</p>
            </div>

            <a href="/login" class="btn auth-submit inline-flex items-center gap-1.5 no-underline">
                ← Back to sign in
            </a>
        </div>

        <div class="auth-bottom">
            <span>© 2026 Nodlify</span>
            <span class="links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Status</a>
      </span>
        </div>
    </div>
</div>

</body>
</html>
