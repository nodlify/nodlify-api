<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(
          title=~{::title},
          header=${null},
          content=~{::main},
          footer=${null},
          scripts=~{::script}
      )}"
>
<head>
    <title th:text="|#{setup.eyebrow} · Nodlify|">Setup · Nodlify</title>
</head>
<body>
<div th:fragment="main"
     class="auth-page"
     x-data="setupWizard()">

    <div class="auth-form-side">
        <div class="auth-top">
            <a href="/"><span class="logo">nodlify<span class="dot">.</span></span></a>
        </div>

        <div class="auth-form-wrap">
            <div class="auth-head">
                <span class="eyebrow" th:text="#{setup.eyebrow}">Initial setup</span>
                <h1 th:text="#{setup.heading}">Configure your app.</h1>
                <p th:text="#{setup.subtitle}">This only runs once. After completion, setup endpoints are locked.</p>
            </div>

            <div class="setup-steps">
                <template x-for="i in 3" :key="i">
                    <div class="setup-step">
                        <div class="setup-step-dot"
                             :class="{ 'setup-step-dot--done': step > i, 'setup-step-dot--active': step === i }">
                            <img x-show="step > i" th:src="@{/icons/check.svg}" class="setup-step-icon" alt="">
                            <span x-show="step <= i" x-text="i"></span>
                        </div>
                        <div x-show="i < 3" class="setup-step-line"
                             :class="{ 'setup-step-line--done': step > i }"></div>
                    </div>
                </template>
            </div>

            <div x-show="error" x-cloak class="setup-error">
                <span class="setup-error-message" x-text="error"></span>
                <button type="button" class="setup-error-dismiss" @click="error = null">✕</button>
            </div>

            <div x-show="step === 1"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-x-4"
                 x-transition:enter-end="opacity-100 translate-x-0">
                <p class="setup-step-label" th:text="#{setup.step1}">Step 1 — Domain</p>

                <form @submit.prevent="setupDomain()" novalidate class="auth-form">
                    <div class="field">
                        <label for="domain" th:text="#{setup.domain}">Application domain</label>
                        <input type="text" id="domain" x-model="domain" required autocomplete="off"
                               th:placeholder="#{setup.domainPlaceholder}"/>
                        <span class="hint" th:text="#{setup.domainHint}">The public URL where this app will be accessible.</span>
                    </div>

                    <button type="submit" class="btn auth-submit" :disabled="loading || !domain.trim()">
                        <img x-show="loading" x-cloak th:src="@{/icons/spinner.svg}" class="setup-spinner" alt=""
                             aria-hidden="true">
                        <span x-text="loading ? $store.i18n.t('setup.saving') : $store.i18n.t('common.continue')">Continue</span>
                        <span class="arrow" x-show="!loading">→</span>
                    </button>
                </form>
            </div>

            <div x-show="step === 2"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-x-4"
                 x-transition:enter-end="opacity-100 translate-x-0">
                <p class="setup-step-label" th:text="#{setup.step2}">Step 2 — Admin account</p>

                <form @submit.prevent="setupAdmin()" novalidate class="auth-form">
                    <div class="field">
                        <label for="email" th:text="#{setup.email}">Email address</label>
                        <input type="email" id="email" x-model="email" required autocomplete="email" autofocus
                               placeholder="admin@yourdomain.com"/>
                    </div>

                    <div class="field">
                        <label for="password" th:text="#{setup.password}">Password</label>
                        <div class="password-wrap">
                            <input :type="showPassword ? 'text' : 'password'" id="password" x-model="password"
                                   required autocomplete="new-password" placeholder="••••••••"/>
                            <button type="button" class="toggle-pw" @click="showPassword = !showPassword"
                                    x-text="showPassword ? $store.i18n.t('common.hide') : $store.i18n.t('common.show')"></button>
                        </div>
                    </div>

                    <button type="submit" class="btn auth-submit"
                            :disabled="loading || !email.trim() || !password.trim()">
                        <img x-show="loading" x-cloak th:src="@{/icons/spinner.svg}" class="setup-spinner" alt=""
                             aria-hidden="true">
                        <span x-text="loading ? $store.i18n.t('setup.creating') : $store.i18n.t('common.continue')">Continue</span>
                        <span class="arrow" x-show="!loading">→</span>
                    </button>
                </form>
            </div>

            <div x-show="step === 3"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-x-4"
                 x-transition:enter-end="opacity-100 translate-x-0">
                <p class="setup-step-label" th:text="#{setup.step3}">Step 3 — Confirm</p>

                <div class="setup-summary">
                    <div class="setup-summary-row">
                        <span class="setup-summary-label" th:text="#{setup.summaryDomain}">Domain</span>
                        <span class="setup-summary-value" x-text="domain"></span>
                    </div>
                    <div class="setup-summary-row">
                        <span class="setup-summary-label" th:text="#{setup.summaryAdmin}">Administrator</span>
                        <span class="setup-summary-value" x-text="email"></span>
                    </div>
                </div>

                <button @click="completeSetup()" class="btn auth-submit" :disabled="loading">
                    <img x-show="loading" x-cloak th:src="@{/icons/spinner.svg}" class="setup-spinner" alt=""
                         aria-hidden="true">
                    <span x-text="loading ? $store.i18n.t('setup.finalising') : $store.i18n.t('setup.complete')">Complete setup</span>
                    <span class="arrow" x-show="!loading">→</span>
                </button>
            </div>
        </div>

        <div class="auth-bottom">
            <span th:text="#{footer.copyrightShort}">© 2026 Nodlify</span>
            <span class="links">
        <a href="#" th:text="#{common.privacy}">Privacy</a>
        <a href="#" th:text="#{common.terms}">Terms</a>
        <a href="#" th:text="#{common.status}">Status</a>
      </span>
        </div>
    </div>
</div>

<script th:fragment="script">
    function setupWizard() {
        return {
            step: 1,
            loading: false,
            error: null,
            showPassword: false,
            domain: '',
            email: '',
            password: '',

            async setupDomain() {
                this.loading = true;
                this.error = null;
                try {
                    const res = await fetch('/api/v1/setup/domain', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({domain: this.domain.trim()})
                    });
                    if (!res.ok) throw new Error(await res.text().catch(() => null) || this.$store.i18n.t('setup.errorDomain'));
                    this.step = 2;
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.loading = false;
                }
            },

            async setupAdmin() {
                this.loading = true;
                this.error = null;
                try {
                    const res = await fetch('/api/v1/setup/admin', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({email: this.email.trim(), password: this.password})
                    });
                    if (!res.ok) throw new Error(await res.text().catch(() => null) || this.$store.i18n.t('setup.errorAdmin'));
                    this.step = 3;
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.loading = false;
                }
            },

            async completeSetup() {
                this.loading = true;
                this.error = null;
                try {
                    const res = await fetch('/api/v1/setup', {method: 'POST'});
                    if (!res.ok) throw new Error(await res.text().catch(() => null) || this.$store.i18n.t('setup.errorComplete'));
                    window.location.href = '/login';
                } catch (e) {
                    this.error = e.message;
                    this.loading = false;
                }
            }
        };
    }
</script>

</body>
</html>
