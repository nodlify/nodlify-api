<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(
          title=~{::title},
          header=~{::header},
          content=~{::main},
          footer=~{fragments/footer :: footerMinimal},
          scripts=~{::script}
      )}"
>
<head>
    <title th:text="|#{vote.pageTitle} · Nodlify|">Vote · Nodlify</title>
</head>
<body>

<header th:fragment="header" class="cp-nav">
    <div class="wrap cp-nav-inner">
        <a href="/"><span class="logo">nodlify<span class="dot">.</span></span></a>
    </div>
</header>

<div th:fragment="main" x-data="votePage()" x-init="init()" th:data-poll-id="${pollId}">

    <div x-show="loading" x-cloak>
        <div class="vote-wrap">
            <div class="vote-head"><span class="eyebrow" th:text="#{poll.loading}">Loading…</span></div>
        </div>
    </div>

    <div x-show="!loading && error" x-cloak>
        <div class="vote-wrap">
            <div class="vote-head">
                <span class="eyebrow" th:text="#{poll.errorEyebrow}">Something went wrong</span>
                <h1 x-text="error"></h1>
            </div>
        </div>
    </div>

    <div x-show="!loading && !error" x-cloak>
        <div class="vote-wrap">
            <div class="vote-admin-actions" x-show="canEdit" x-cloak>
                <a class="btn btn-sm btn-ghost" :href="'/poll/' + pollId" th:text="#{vote.editPoll}">Edit poll</a>
            </div>

            <div class="vote-head">
                <span class="eyebrow" th:text="#{vote.invited}">You've been invited to vote</span>
                <h1 x-text="poll.title"></h1>
                <p class="desc" x-show="poll.description" x-text="poll.description"></p>

                <div class="vote-meta">
                    <div class="vote-meta-item" x-show="poll.organizer">
            <span class="icon">
              <img th:src="@{/icons/user.svg}" width="13" height="13" alt="" aria-hidden="true">
            </span>
                        <span><span th:text="#{vote.organizedBy}">Organized by</span> <b x-text="poll.organizer"></b></span>
                    </div>
                    <div class="vote-meta-item" x-show="poll.location">
            <span class="icon">
              <img th:src="@{/icons/location.svg}" width="13" height="13" alt="" aria-hidden="true">
            </span>
                        <span x-text="poll.location"></span>
                    </div>
                    <div class="vote-meta-item" x-show="poll.deadline">
            <span class="icon">
              <img th:src="@{/icons/clock.svg}" width="13" height="13" alt="" aria-hidden="true">
            </span>
                        <span x-text="poll.deadline"></span>
                    </div>
                </div>
            </div>

            <div class="vote-closed-banner" x-show="!votingOpen" x-cloak
                 x-text="poll.status === 'DECIDED' ? $store.i18n.t('vote.decidedBanner') : $store.i18n.t('vote.closedBanner')"></div>

            <div class="options-section">
                <div class="section-title">
                    <span th:text="#{vote.pick}">Pick what works for you</span>
                    <span class="hint" x-text="filledCount + '/' + poll.options.length + ' ' + $store.i18n.t('vote.answered')"></span>
                </div>
                <div class="option-list">
                    <template x-for="opt in poll.options" :key="opt.id">
                        <div class="option-card" :class="{ 'has-yes': votes[opt.id] === 'yes' }">
                            <div class="option-info">
                                <div class="option-day" x-text="opt.day"></div>
                                <div class="option-time" x-text="opt.time"></div>
                                <div class="option-summary">
                                    <span class="yes">✓ <span x-text="resultCount(opt.id, 'yes')"></span></span>
                                    <span class="maybe">? <span x-text="resultCount(opt.id, 'maybe')"></span></span>
                                    <span class="no">✕ <span x-text="resultCount(opt.id, 'no')"></span></span>
                                </div>
                                <div class="option-voters" x-show="optionVotes(opt.id).length">
                                    <template x-for="vote in optionVotes(opt.id)" :key="opt.id + '-' + vote.participantId">
                                        <span class="option-voter" :class="vote.availability">
                                            <span x-text="vote.name"></span>
                                            <b x-text="voteGlyph(vote.availability)"></b>
                                        </span>
                                    </template>
                                </div>
                            </div>
                            <div class="vote-buttons">
                                <button class="vote-btn yes" :class="{ active: votes[opt.id] === 'yes' }"
                                        :disabled="!votingOpen"
                                        @click="cast(opt.id, 'yes')" :aria-label="$store.i18n.t('vote.yes')">
                                    <span class="glyph">✓</span>
                                    <span class="lbl" x-text="$store.i18n.t('vote.yes')">Yes</span>
                                </button>
                                <button class="vote-btn maybe" :class="{ active: votes[opt.id] === 'maybe' }"
                                        :disabled="!votingOpen"
                                        @click="cast(opt.id, 'maybe')" :aria-label="$store.i18n.t('vote.maybe')">
                                    <span class="glyph">?</span>
                                    <span class="lbl" x-text="$store.i18n.t('vote.maybe')">Maybe</span>
                                </button>
                                <button class="vote-btn no" :class="{ active: votes[opt.id] === 'no' }"
                                        :disabled="!votingOpen"
                                        @click="cast(opt.id, 'no')" :aria-label="$store.i18n.t('vote.no')">
                                    <span class="glyph">✕</span>
                                    <span class="lbl" x-text="$store.i18n.t('vote.no')">No</span>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="name-section" x-show="!identityKnown" x-cloak>
                <div class="section-title mb-0">
                    <span th:text="#{vote.whoAreYou}">Who are you?</span>
                    <span class="hint" th:text="#{vote.whoHint}">Required so the organizer knows who voted</span>
                </div>
                <div class="row">
                    <label>
                        <span th:text="#{vote.yourName}">Your name</span>
                        <input type="text" th:placeholder="#{vote.namePlaceholder}" x-model="name" x-ref="nameInput"/>
                    </label>
                    <label>
                        <span><span th:text="#{vote.email}">Email</span> <span class="ml-1.5 text-xs text-[var(--muted-2)]" th:text="#{vote.optionalParen}">(optional)</span></span>
                        <input type="email" placeholder="anja@acme.io" x-model="email"/>
                    </label>
                </div>
                <span class="text-xs text-[var(--muted)]" th:text="#{vote.emailHint}">
          Add your email and we'll send you the calendar invite once the time is locked.
                </span>
            </div>

            <div class="vote-action-error" x-show="actionError" x-text="actionError" x-cloak></div>

            <div class="poll-results">
                <div class="poll-results-head">
                    <span class="eyebrow" th:text="#{vote.results}">Results</span>
                    <h3 th:text="#{vote.results.title}">Group availability</h3>
                </div>
                <div class="result-options">
                    <template x-for="(opt, index) in sortedResultOptions" :key="'result-' + opt.id">
                        <div class="result-option" :class="{ leading: index === 0 }">
                            <div class="result-option-head">
                                <div>
                                    <strong x-text="opt.day"></strong>
                                    <small x-text="opt.time"></small>
                                </div>
                                <div class="result-option-score">
                                    <span class="yes">✓ <span x-text="resultCount(opt.id, 'yes')"></span></span>
                                    <span class="maybe">? <span x-text="resultCount(opt.id, 'maybe')"></span></span>
                                    <span class="no">✕ <span x-text="resultCount(opt.id, 'no')"></span></span>
                                </div>
                            </div>
                            <div class="result-option-voters" x-show="optionVotes(opt.id).length">
                                <template x-for="vote in optionVotes(opt.id)" :key="'result-' + opt.id + '-' + vote.participantId">
                                    <span class="option-voter" :class="vote.availability">
                                        <span x-text="vote.name"></span>
                                        <b x-text="voteGlyph(vote.availability)"></b>
                                    </span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
                <p class="poll-results-empty" x-show="!collectedVotes.length" th:text="#{vote.noResults}">
                    No votes yet.
                </p>
            </div>

        </div>
    </div>

</div>

<script th:fragment="script">
    function votePage() {
        return {
            pollId: '',
            poll: {title: '', description: '', organizer: '', location: '', deadline: '', status: 'VOTING', options: [], participants: []},
            votes: {},
            tallies: {},
            collectedVotes: [],
            savingOptions: {},
            voteVersions: {},
            pollingTimer: null,
            participantId: null,
            currentUser: null,
            name: '',
            email: '',
            loading: true,
            error: '',
            actionError: '',

            async init() {
                this.pollId = this.$el.dataset.pollId;
                await Promise.all([this.loadPoll(), this.loadCurrentUser()]);
                if (this.error) return;
                this.restoreParticipant();
                await this.fetchVotes();
                this.pollingTimer = window.setInterval(() => this.fetchVotes(), 5000);
            },

            destroy() {
                if (this.pollingTimer) window.clearInterval(this.pollingTimer);
            },

            csrfHeaders() {
                const token = document.querySelector('meta[name="_csrf"]')?.content;
                const header = document.querySelector('meta[name="_csrf_header"]')?.content;
                const headers = {'Content-Type': 'application/json', 'Accept': 'application/json'};
                if (token && header) headers[header] = token;
                return headers;
            },

            async loadCurrentUser() {
                try {
                    const res = await fetch('/api/v1/user', {
                        headers: {'Accept': 'application/json'},
                        credentials: 'same-origin',
                    });
                    if (!res.ok || res.status === 204) return;
                    this.currentUser = await res.json();
                    this.name = this.currentUser.displayName || '';
                    this.email = this.currentUser.email || '';
                } catch (_) {}
            },

            get storageKey() {
                return 'nodlify:vote:' + this.pollId;
            },

            restoreParticipant() {
                if (this.currentUser) return;
                try {
                    const stored = JSON.parse(localStorage.getItem(this.storageKey));
                    if (!stored?.participantId) return;
                    this.participantId = stored.participantId;
                    this.name = stored.name || '';
                    this.email = stored.email || '';
                    this.votes = stored.votes || {};
                } catch (_) {}
            },

            rememberParticipant() {
                if (this.currentUser) return;
                localStorage.setItem(this.storageKey, JSON.stringify({
                    participantId: this.participantId,
                    name: this.name,
                    email: this.email,
                    votes: this.votes,
                }));
            },

            async fetchVotes() {
                try {
                    const request = {headers: {'Accept': 'application/json'}, credentials: 'same-origin'};
                    const [votesRes, pollRes] = await Promise.all([
                        fetch('/api/v1/polls/' + encodeURIComponent(this.pollId) + '/votes', request),
                        fetch('/api/v1/polls/' + encodeURIComponent(this.pollId), request),
                    ]);
                    if (!votesRes.ok) return;
                    const votes = await votesRes.json();
                    if (pollRes.ok) {
                        const data = await pollRes.json();
                        this.poll.participants = (data.participants || []).map(participant => ({
                            id: participant.id,
                            name: participant.name,
                            email: participant.email || '',
                        }));
                    }
                    const tallies = {};
                    this.poll.options.forEach(o => tallies[o.id] = {yes: 0, maybe: 0, no: 0});
                    votes.forEach(v => {
                        const tally = tallies[v.optionId];
                        if (!tally) return;
                        const a = (v.availability || '').toLowerCase();
                        if (a === 'yes') tally.yes++;
                        else if (a === 'maybe') tally.maybe++;
                        else if (a === 'no') tally.no++;
                    });
                    this.tallies = tallies;
                    this.collectedVotes = votes;
                    this.matchKnownParticipant();
                    this.restoreVotesFromServer();
                } catch (_) {}
            },

            async loadPoll() {
                try {
                    const res = await fetch('/api/v1/polls/' + encodeURIComponent(this.pollId),
                            {headers: {'Accept': 'application/json'}, credentials: 'same-origin'});
                    if (!res.ok) {
                        this.error = res.status === 404 ? this.$store.i18n.t('vote.notFound') : this.$store.i18n.t('poll.loadError');
                        return;
                    }
                    const data = await res.json();
                    const options = (data.optionGroups || [])
                            .flatMap(group => group.options || [])
                            .sort((a, b) => new Date(a.startAt) - new Date(b.startAt))
                            .map(opt => ({
                                id: opt.optionId,
                                day: this.formatDay(opt.startAt),
                                time: opt.wholeDay
                                        ? this.$store.i18n.t('cp.allDay')
                                        : this.formatTime(opt.startAt) + ' – ' + this.formatTime(opt.endAt),
                            }));
                    this.poll = {
                        title: data.title,
                        description: data.description || '',
                        organizer: data.organizer || '',
                        location: data.location ? data.location.address : '',
                        deadline: data.votingDeadline ? this.$store.i18n.t('vote.closes') + ' ' + this.formatDeadline(data.votingDeadline) : '',
                        status: data.status || 'VOTING',
                        options,
                        participants: (data.participants || []).map(participant => ({
                            id: participant.id,
                            name: participant.name,
                            email: participant.email || '',
                        })),
                    };
                } catch (_) {
                    this.error = this.$store.i18n.t('poll.loadError');
                } finally {
                    this.loading = false;
                }
            },

            matchKnownParticipant() {
                if (this.participantId || !this.currentUser?.email) return;
                const email = this.currentUser.email.toLowerCase();
                const participant = this.poll.participants.find(item => item.email?.toLowerCase() === email);
                if (participant) this.participantId = participant.id;
            },

            restoreVotesFromServer() {
                if (!this.participantId) return;
                const restored = {};
                this.collectedVotes
                        .filter(vote => vote.participantId === this.participantId)
                        .forEach(vote => restored[vote.optionId] = (vote.availability || '').toLowerCase());
                Object.keys(this.savingOptions).forEach(optionId => restored[optionId] = this.votes[optionId]);
                this.votes = restored;
                this.rememberParticipant();
            },

            async ensureParticipant() {
                if (this.participantId) return true;
                if (!this.currentUser && !this.name.trim()) {
                    this.actionError = this.$store.i18n.t('vote.addName');
                    this.$nextTick(() => this.$refs.nameInput?.focus());
                    return false;
                }

                const response = await fetch('/api/v1/polls/' + encodeURIComponent(this.pollId) + '/participants', {
                    method: 'POST',
                    headers: this.csrfHeaders(),
                    credentials: 'same-origin',
                    body: this.currentUser
                            ? null
                            : JSON.stringify({displayName: this.name.trim(), email: this.email.trim() || null}),
                });
                if (!response.ok) return false;

                const participant = await response.json();
                this.participantId = participant.id;
                this.poll.participants = [
                    ...this.poll.participants.filter(item => item.id !== participant.id),
                    {
                        id: participant.id,
                        name: participant.name,
                        email: participant.email || '',
                    },
                ];
                this.rememberParticipant();
                return true;
            },

            async cast(optId, value) {
                if (!this.votingOpen || this.votes[optId] === value) return;
                this.actionError = '';
                const previous = this.votes[optId];
                let version = null;

                try {
                    if (!await this.ensureParticipant()) {
                        if (!this.actionError) this.actionError = this.$store.i18n.t('vote.submitError');
                        return;
                    }

                    this.votes = {...this.votes, [optId]: value};
                    version = (this.voteVersions[optId] || 0) + 1;
                    this.voteVersions = {...this.voteVersions, [optId]: version};
                    this.savingOptions = {...this.savingOptions, [optId]: true};

                    const response = await fetch('/api/v1/polls/' + encodeURIComponent(this.pollId) + '/votes', {
                        method: 'POST',
                        headers: this.csrfHeaders(),
                        credentials: 'same-origin',
                        body: JSON.stringify({
                            participantId: this.participantId,
                            optionId: optId,
                            availability: value,
                        }),
                    });
                    if (!response.ok) {
                        if (this.voteVersions[optId] === version) {
                            this.votes = {...this.votes, [optId]: previous};
                            this.actionError = this.$store.i18n.t('vote.submitError');
                        }
                        return;
                    }

                    this.rememberParticipant();
                    await this.fetchVotes();
                } catch (_) {
                    if (version !== null && this.voteVersions[optId] === version) {
                        this.votes = {...this.votes, [optId]: previous};
                        this.actionError = this.$store.i18n.t('vote.submitError');
                    }
                } finally {
                    if (version !== null && this.voteVersions[optId] === version) {
                        const savingOptions = {...this.savingOptions};
                        delete savingOptions[optId];
                        this.savingOptions = savingOptions;
                    }
                }
            },

            get votingOpen() {
                return this.poll.status === 'VOTING';
            },
            get canEdit() {
                return (this.currentUser?.roles || []).includes('ADMIN');
            },
            get identityKnown() {
                return Boolean(this.currentUser || this.participantId);
            },
            get filledCount() {
                return this.poll.options.filter(o => this.votes[o.id]).length;
            },
            resultCount(optionId, availability) {
                return this.tallies[optionId]?.[availability] || 0;
            },
            optionVotes(optionId) {
                const order = {yes: 0, maybe: 1, no: 2};
                return this.collectedVotes
                        .filter(vote => vote.optionId === optionId)
                        .map(vote => {
                            const participant = this.poll.participants.find(item => item.id === vote.participantId);
                            return {
                                participantId: vote.participantId,
                                name: participant?.name || '',
                                availability: (vote.availability || '').toLowerCase(),
                            };
                        })
                        .filter(vote => vote.name)
                        .sort((a, b) => order[a.availability] - order[b.availability]
                                || a.name.localeCompare(b.name));
            },
            get sortedResultOptions() {
                return [...this.poll.options].sort((a, b) => {
                    const scoreA = this.resultCount(a.id, 'yes') * 2 + this.resultCount(a.id, 'maybe');
                    const scoreB = this.resultCount(b.id, 'yes') * 2 + this.resultCount(b.id, 'maybe');
                    return scoreB - scoreA
                            || this.resultCount(b.id, 'yes') - this.resultCount(a.id, 'yes')
                            || this.resultCount(b.id, 'maybe') - this.resultCount(a.id, 'maybe')
                            || this.resultCount(a.id, 'no') - this.resultCount(b.id, 'no');
                });
            },
            voteGlyph(availability) {
                return {yes: '✓', maybe: '?', no: '✕'}[availability] || '—';
            },

            formatDay(iso) {
                return new Date(iso).toLocaleDateString(document.documentElement.lang || undefined,
                        {weekday: 'short', month: 'short', day: 'numeric'});
            },
            formatTime(iso) {
                return new Date(iso).toLocaleTimeString(document.documentElement.lang || undefined,
                        {hour: '2-digit', minute: '2-digit'});
            },
            formatDeadline(iso) {
                return new Date(iso).toLocaleString(document.documentElement.lang || undefined,
                        {weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'});
            },
        };
    }
</script>

</body>
</html>
